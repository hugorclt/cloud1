- name: Map architecture for Docker repository
  ansible.builtin.set_fact:
    cloud1_docker_arch: >-
      {{ 'amd64' if ansible_architecture == 'x86_64'
         else 'arm64' if ansible_architecture in ['aarch64', 'arm64']
         else 'armhf' if ansible_architecture in ['armv7l', 'armv6l']
         else ansible_architecture }}

- name: Map distribution for Docker repository
  ansible.builtin.set_fact:
    cloud1_docker_repo_os: >-
      {{ 'debian' if ansible_distribution == 'Debian'
         else 'ubuntu' if ansible_distribution == 'Ubuntu'
         else ansible_distribution | lower }}

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ cloud1_docker_repo_os }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Remove old broken Docker Ubuntu repository if present
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ cloud1_docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: absent
    update_cache: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ cloud1_docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ cloud1_docker_repo_os }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Check Docker Compose plugin
  ansible.builtin.command: docker compose version
  register: cloud1_compose_version
  changed_when: false