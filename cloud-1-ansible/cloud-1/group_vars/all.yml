---
# Global Cloud-1 configuration.
# For local Vagrant testing, use https://cloud1.localhost:8443 and https://pma.cloud1.localhost:8443
# For a remote server without a domain, use nip.io, for example:
# cloud1_domain: "1.2.3.4.nip.io"
# cloud1_pma_domain: "pma.1.2.3.4.nip.io"

cloud1_domain: "cloud1.localhost"
cloud1_pma_domain: "pma.cloud1.localhost"

cloud1_project_dir: "/opt/cloud-1"
cloud1_compose_project_name: "cloud1"

cloud1_db_name: "wordpress"
cloud1_db_user: "wordpress"
cloud1_wp_table_prefix: "wp_"

# Keep this true on real servers. It only opens SSH, HTTP and HTTPS.
cloud1_manage_firewall: true

# Self-signed TLS is generated by Ansible. Replace certs manually or extend the playbook for Let's Encrypt
# when you have a real domain pointing to the VPS.
cloud1_tls_days: 3650
cloud1_tls_country: "FR"
cloud1_tls_state: "Ile-de-France"
cloud1_tls_locality: "Paris"
cloud1_tls_org: "42 Cloud-1"

# Pinned-ish official images. Major-version tags keep the project simple and portable for evaluation.
cloud1_image_nginx: "nginx:1-alpine"
cloud1_image_mariadb: "mariadb:11"
cloud1_image_wordpress: "wordpress:6-php8.3-fpm-alpine"
cloud1_image_phpmyadmin: "phpmyadmin:5-apache"
